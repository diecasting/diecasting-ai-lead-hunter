[project]
name = "diecasting-ai-lead-hunter"
version = "0.1.0"
description = "B2B AI customer-search system for the metal die-casting industry"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "psycopg2-binary==2.9.9",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-dotenv==1.0.1",
    "openai==1.47.0",
    "playwright==1.47.0",
    "httpx==0.27.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
